<!--
  Smart email signature — Phase 1
  Paste the rendered content of this file into Gmail: Settings → See all settings → Signature.
  (Open /sig/preview, or open this file in a browser, select all, copy, paste into the Gmail
  signature editor. Do not paste this source code as text.)

  All links route through https://brandonmicci.com/go/<slug> (live in Phase 2) and the
  headshot is served from https://brandonmicci.com/sig/headshot.png, so destinations and
  the photo can change later without re-pasting the signature.

  The navy card uses a CSS gradient with a solid background-color fallback for clients
  (Outlook desktop) that ignore gradients; border-radius degrades to square corners there.
-->
