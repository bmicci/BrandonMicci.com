<!--
  Smart email signature — mobile-friendly revision
  Paste the rendered content of this file into Gmail: Settings → See all settings → Signature.
  (Open /sig/preview, select the signature card, copy, paste into the Gmail signature editor.)

  All links route through https://brandonmicci.com/go/<slug> and the headshot is served
  from https://brandonmicci.com/sig/headshot.png, so destinations and the photo can
  change later without re-pasting the signature. Layout changes DO require a re-paste.

  Gmail strips <style> blocks, so there are no media queries: this one fixed layout is
  sized to fit a ~360px phone viewport without the photo cell being squeezed (which
  ovaled the headshot) or links wrapping mid-word.
-->
