name: Lighthouse CI

on:
  pull_request:
    branches: [main, fix/stabilize-backgrounds, prod, stage, preview, test/**]
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      # LHCI will start the server automatically via startServerCommand in .lighthouserc.json
      - run: npx lhci autorun --config=.lighthouserc.json --budgetsPath=budgets.json
